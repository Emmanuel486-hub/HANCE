<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Login Form</title>
  <link href="login style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Login Form</h1>
    <div class="tabs">
      <button class="active">Login</button>
      <button><a href="signup page.html" style="text-decoration:none;">Signup</a></button>
    </div>
    <form>
      <div class="form-group">
        <input type="email" id="email" name="email" placeholder="Email Address">
      </div>
      <div class="form-group">
        <input type="password" id="password" name="password" placeholder="Password">
      </div>
      <div class="forgot-password">
        <a href="https://accounts.google.com/signin/v2/recoveryidentifier" target="_blank">forgot password</a>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div class="signup-link">
      Not a member?<a href="signup page.html">Signup</a>
    </div>
  </div>
</body>
</html>
